# Cloudflare Worker для чек-аута ЛК. Развёртывание: см. README, раздел «Посредник для GitHub Pages».
name = "coral-lk-checkout"
main = "worker.mjs"
compatibility_date = "2024-11-01"

[vars]
# Откуда разрешены запросы (страница ЛК). Добавьте свои адреса через запятую.
ALLOWED_ORIGINS = "https://bogdan787878.github.io"
CC4_BASE = "https://api.coral.club"

# Хранилище сессий магазина: создаётся командой `wrangler kv namespace create SESSIONS`, подставьте выданный id.
[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
