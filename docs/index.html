<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ЛК Coral Club · тестовый стенд</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="friend.css" />
</head>
<body>
  <!-- вход -->
  <main id="login-view" class="center">
    <form id="login-form" class="card login" autocomplete="off">
      <p class="eyebrow">Тестовый стенд · изолирован</p>
      <h1>Вход в личный кабинет</h1>
      <p class="muted">Логин и пароль уходят только в магазин, на этом стенде не сохраняются.</p>
      <label>Логин
        <input name="login" autocomplete="username" required />
      </label>
      <label>Пароль
        <input name="password" type="password" autocomplete="current-password" required />
      </label>
      <div class="row">
        <label>Страна
          <input name="deliveryId" value="RU" maxlength="2" />
        </label>
        <label>Язык
          <input name="language" value="ru" maxlength="2" />
        </label>
      </div>
      <button class="btn" type="submit" id="login-btn">Войти</button>
      <p id="login-msg" class="msg" role="status"></p>
    </form>
  </main>

  <!-- главная -->
  <div id="dash-view" hidden>

    <main class="home" id="home"></main>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
